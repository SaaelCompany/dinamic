ru.saael.dynamicfields.admin.help.title=How it works
ru.saael.dynamicfields.admin.help.how=Fields, options and conditions live in this plugin. You do not create or hide Jira custom fields. Several blocks can be published together.
ru.saael.dynamicfields.admin.help.when=A field can depend only on a field above it in the same block. Empty condition values mean the parent has any answer. Nesting is unlimited.
ru.saael.dynamicfields.admin.help.scope=On each block, choose every request type or only the selected ones. If the list does not load, the id is the number after /create/. Position is before the send button, at the top of the form, or after a field named as the customer sees it.
ru.saael.dynamicfields.admin.help.answers=When the customer sends the request, the answers are saved on it and shown to the support agent in the panel Portal answers.
