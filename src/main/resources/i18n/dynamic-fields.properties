ru.saael.dynamicfields.admin.section=Dynamic fields
ru.saael.dynamicfields.admin.title=Portal dynamic fields
ru.saael.dynamicfields.admin.intro=Build the extra questions here. Each block belongs to one request type and, after Save, appears only on that type. Jira custom fields are not used.
ru.saael.dynamicfields.admin.info=Hidden answers are not saved. Nothing changes on the portal until you press Save.
ru.saael.dynamicfields.admin.steps.1=Choose a request type and build only its fields. A nested field sits under the field it depends on.
ru.saael.dynamicfields.admin.steps.2=Press Save.
ru.saael.dynamicfields.admin.steps.3=Reload the portal page where a customer creates a request. The block appears in the place you chose.
ru.saael.dynamicfields.admin.steps.types=A block belongs to one request type and is not added to every type. Pick the type at the top: the list shows only its fields.
ru.saael.dynamicfields.admin.steps.many=Need several blocks? Press Add block. Each block has its own title, fields and request types.
