ru.saael.dynamicfields.admin.help.title=How it works
ru.saael.dynamicfields.admin.help.how=Each custom field of type Dynamic fields has its own questions. Create the field in Jira, configure the questions here, then add that field to a request type.
ru.saael.dynamicfields.admin.help.when=A field can depend only on a field above it in the same block. Empty condition values mean the parent has any answer. Nesting is unlimited.
ru.saael.dynamicfields.admin.help.scope=The questions appear on the portal in the place where you add this field to the request type. The answers of that field appear in the issue details.
ru.saael.dynamicfields.admin.help.answers=Answers are stored in the field Dynamic fields and shown in the issue details. Each question also becomes its own text field, so automation can compare that field with the answer text. Use the Issue updated trigger.
