ru.saael.dynamicfields.admin.section=Dynamic fields
ru.saael.dynamicfields.admin.title=Portal dynamic fields
ru.saael.dynamicfields.admin.intro=Show fields on the customer portal only when a trigger checkbox or option is selected. Rules can be nested without limit: a field shown by one rule may itself be the trigger of another one.
ru.saael.dynamicfields.admin.rules.label=Rules (JSON)
ru.saael.dynamicfields.admin.rules.description=The document is validated before saving. Fields that are listed in "show" of any rule are hidden until the rule matches.
ru.saael.dynamicfields.admin.rules.count=Rules configured: {0}
