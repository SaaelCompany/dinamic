ru.saael.dynamicfields.admin.help.title=Reference
ru.saael.dynamicfields.admin.help.fieldid=Field id is the Jira field id, e.g. customfield_10100 (Administration > Issues > Custom fields > "..." > Edit: the id is in the page URL) or a system field id such as description, priority.
ru.saael.dynamicfields.admin.help.values="when.values" accepts option ids (10200) as well as option labels ("Medical staff"). Empty "values" means "the field has any value".
ru.saael.dynamicfields.admin.help.scope="portalId" and "requestTypeIds" are optional. Both are visible in the portal URL: /servicedesk/customer/portal/'{'portalId'}'/create/'{'requestTypeId'}'.
ru.saael.dynamicfields.admin.help.required=Fields that are hidden by a rule must not be marked as required in the request type, otherwise the portal will refuse to submit the request while they are hidden.
ru.saael.dynamicfields.admin.help.clear="clearOnHide" (global or per rule) resets the value of a field when it gets hidden, so that stale answers are not sent with the request.
