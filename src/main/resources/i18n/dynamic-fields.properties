ru.saael.dynamicfields.admin.title=Portal dynamic fields
ru.saael.dynamicfields.admin.intro=Build the extra questions here. After Save, each block appears on the customer portal by itself. Jira custom fields are not used.
ru.saael.dynamicfields.admin.info=Hidden answers are not saved. Nothing changes on the portal until you press Save.
ru.saael.dynamicfields.admin.steps.1=Build the fields. A nested field sits under the field it depends on.
ru.saael.dynamicfields.admin.steps.2=Press Save.
ru.saael.dynamicfields.admin.steps.3=Reload the portal page where a customer creates a request. The block appears above the send button on its own.
ru.saael.dynamicfields.admin.steps.types=An empty request-type list shows the block on every create form. Otherwise enter the number after /create/ in the portal address. Different blocks can use different numbers.
ru.saael.dynamicfields.admin.steps.many=Need several blocks? Press Add block. Each block has its own title, fields and request types.
